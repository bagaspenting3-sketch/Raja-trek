<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>TikTok Stats</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="hero">
      <p class="eyebrow">TikTok Analytics</p>
      <h1>Statistik video,<br>tanpa ribet.</h1>
      <p class="lead">Tempel link video TikTok untuk melihat views, likes, komentar, share, dan simpanan.</p>

      <form id="searchForm" class="search-box" novalidate>
        <input id="videoUrl" type="url" inputmode="url"
          placeholder="https://www.tiktok.com/@username/video/..."
          autocomplete="off" autocapitalize="off" spellcheck="false"
          aria-label="Link video TikTok" required>
        <button id="checkButton" type="submit">Check</button>
      </form>

      <p id="error" class="error hidden" role="alert"></p>
    </section>

    <section id="loading" class="loading hidden" aria-live="polite">
      <div class="spinner"></div>
      <span>Mengambil data video…</span>
    </section>

    <section id="result" class="result hidden" aria-live="polite">
      <div class="result-top">
        <div class="result-title">
          <h2>Statistik Video</h2>
          <p id="videoId"></p>
        </div>
        <a id="openTikTok" class="open-btn" target="_blank" rel="noopener noreferrer">Buka TikTok ↗</a>
      </div>

      <p id="description" class="description hidden"></p>

      <div class="stats">
        <div class="card card-main">
          <div class="label">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <small>Views</small>
          </div>
          <strong id="views">0</strong>
        </div>

        <div class="card">
          <div class="label">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-8-4.9-8-11A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5c0 6.1-8 11-8 11Z"/></svg>
            <small>Likes</small>
          </div>
          <strong id="likes">0</strong>
        </div>

        <div class="card">
          <div class="label">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12Z"/></svg>
            <small>Komentar</small>
          </div>
          <strong id="comments">0</strong>
        </div>

        <div class="card">
          <div class="label">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="m16 7-4-4-4 4"/><path d="M12 3v13"/></svg>
            <small>Shares</small>
          </div>
          <strong id="shares">0</strong>
        </div>

        <div class="card">
          <div class="label">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1Z"/></svg>
            <small>Simpanan</small>
          </div>
          <strong id="saves">0</strong>
        </div>
      </div>

      <div class="meta">
        <span>Diunggah <b id="createdAt">-</b></span>
        <span>Diambil <b id="fetchedAt">-</b></span>
      </div>
    </section>

    <footer>TikTok Stats</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
